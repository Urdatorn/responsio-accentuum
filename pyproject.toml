[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "responsio-accentuum"
version = "0.1.0"
description = "Measure accentual responsion in Ancient Greek polystrophic lyric."
readme = "README.md"
authors = [{ name = "Albin Thörn Cleland" }]
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4",
  "grc-utils",
  "lxml",
  "seaborn",
  "scipy",
  "tqdm",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
notebooks = [
  "ipykernel",
  "ipython",
  "jupyter",
  "matplotlib",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
